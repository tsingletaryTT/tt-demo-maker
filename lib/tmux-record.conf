# Isolated tmux config for recording sessions only (tmux_capture.sh, split.sh).
#
# Loaded via `-L ttdemo-rec -f this-file`, never the default socket, so a
# host's own ~/.tmux.conf (status bar styling, session/window name, clock)
# never bleeds into a recording — confirmed leaking "ttcap_<pid>" and a live
# date/time stamp into a captured .cast before this existed. A dedicated
# socket is required, not just -f: tmux only honors -f when it starts a new
# server for that socket name; on the default socket, if a server (e.g. the
# operator's own interactive tmux) is already up, -f is silently ignored and
# the running server's own config still applies.
set -g status off

# Truecolor. Without this tmux downsamples every 24-bit color a TUI prints
# (tt-toplike's gradients, the tt-brand palette) to the 256-color cube, which
# shows up as banding and off-brand teal. `terminal-features` (tmux >= 3.2)
# tells tmux the outer terminal does RGB whatever $TERM says; `terminal-overrides`
# covers older builds. COLORTERM is what most TUIs actually test before
# choosing 24-bit output, and a recording box's shell rarely sets it.
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -as terminal-overrides ",*:Tc"
setenv -g COLORTERM truecolor
