[package]
name = "tt-demo"
version = "0.1.0"
edition = "2021"
description = "Reusable demo-recording toolkit: manifest -> footage + draft post"

[[bin]]
name = "tt-demo"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yml = "0.0.12"
serde_json = "1"
minijinja = "2"
regex = "1"
which = "6"
ureq = { version = "2", features = ["json"] }
anyhow = "1"
thiserror = "1"
